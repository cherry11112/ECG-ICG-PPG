<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

  <div class="fixed top-0 left-0 w-full bg-white shadow-md z-50 flex items-center px-6 sm:px-12 md:px-24 lg:px-24 py-2">
    <img src="" alt="Logo" class="h-24">
  </div>

  <div class="flex justify-center items-center h-screen px-4 sm:px-6 md:px-12 lg:px-24 xl:px-30">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full sm:w-[400px] md:w-[500px] lg:w-[500px] max-w-[90%]">
      
      <!-- Toggle Buttons -->
      <div class="flex mb-6 border-b border-gray-200">
        <button id="loginTab" class="flex-1 py-2 px-4 text-center font-medium text-blue-600 border-b-2 border-blue-600">
          Login
        </button>
        <button id="signupTab" class="flex-1 py-2 px-4 text-center font-medium text-gray-500 hover:text-gray-700">
          Sign Up
        </button>
      </div>

      <!-- Login Form -->
      <div id="loginForm" class="block">
        <h2 class="text-center text-2xl font-semibold mb-6">Login</h2>
        <form id="loginFormElement">
          <label for="loginEmail" class="block text-sm font-medium mb-2">Email:</label>
          <input type="email" id="loginEmail" name="email" required 
                 class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                 placeholder="johndoe@gmail.com">

          <label for="loginPassword" class="block text-sm font-medium mb-2">Password:</label>
          <input type="password" id="loginPassword" name="password" required 
                 class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                 placeholder="Enter your password">

          <label for="loginRole" class="block text-sm font-medium mb-2">Login as:</label>
          <select id="loginRole" name="role" required 
                  class="w-full px-4 py-2 mb-6 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="" disabled selected>Select Role</option>
            <option value="patient">Patient</option>
            <option value="doctor">Doctor</option>
          </select>

          <button type="submit" id="loginBtn"
                  class="w-full bg-white text-black border-2 border-gray-600 hover:bg-gray-300 hover:border-gray-800 rounded-lg transition duration-200 mb-4 py-2">
            Login
          </button>
        </form>
      </div>

      <!-- Sign Up Form -->
      <div id="signupForm" class="hidden">
        <h2 class="text-center text-2xl font-semibold mb-6">Create Account</h2>
        <form id="signupFormElement">
          <label for="signupName" class="block text-sm font-medium mb-2">Full Name:</label>
          <input type="text" id="signupName" name="name" required 
                 class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                 placeholder="John Doe">

          <label for="signupEmail" class="block text-sm font-medium mb-2">Email:</label>
          <input type="email" id="signupEmail" name="email" required 
                 class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                 placeholder="john.doe@example.com">

          <label for="signupPassword" class="block text-sm font-medium mb-2">Password:</label>
          <input type="password" id="signupPassword" name="password" required 
                 class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                 placeholder="Enter password (min 6 characters)">

          <label for="signupRole" class="block text-sm font-medium mb-2">Role:</label>
          <select id="signupRole" name="role" required 
                  class="w-full px-4 py-2 mb-6 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="" disabled selected>Select Role</option>
            <option value="patient">Patient</option>
            <option value="doctor">Doctor</option>
          </select>

          <button type="submit" id="signupBtn"
                  class="w-full bg-white text-black border-2 border-gray-600 hover:bg-gray-300 hover:border-gray-800 rounded-lg transition duration-200 mb-4 py-2">
            Create Account
          </button>
        </form>
      </div>
      
      <div id="errorMessage" class="text-red-500 text-center hidden mt-4"></div>
      <div id="successMessage" class="text-green-500 text-center hidden mt-4"></div>
      <div id="debugInfo" class="text-gray-600 text-sm mt-4 hidden"></div>
    </div>
  </div>

  <script type="module">

    // Tab switching functionality
    document.getElementById('loginTab').addEventListener('click', function() {
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('signupForm').classList.add('hidden');
      document.getElementById('loginTab').classList.add('text-blue-600', 'border-blue-600');
      document.getElementById('loginTab').classList.remove('text-gray-500');
      document.getElementById('signupTab').classList.remove('text-blue-600', 'border-blue-600');
      document.getElementById('signupTab').classList.add('text-gray-500');
    });

    document.getElementById('signupTab').addEventListener('click', function() {
      document.getElementById('signupForm').classList.remove('hidden');
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('signupTab').classList.add('text-blue-600', 'border-blue-600');
      document.getElementById('signupTab').classList.remove('text-gray-500');
      document.getElementById('loginTab').classList.remove('text-blue-600', 'border-blue-600');
      document.getElementById('loginTab').classList.add('text-gray-500');
    });

    // Function to show messages
    function showMessage(message, type = 'error') {
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');
      
      if (type === 'success') {
        successDiv.textContent = message;
        successDiv.classList.remove('hidden');
        errorDiv.classList.add('hidden');
      } else {
        errorDiv.textContent = message;
        errorDiv.classList.remove('hidden');
        successDiv.classList.add('hidden');
      }
    }

    // Signup via our API
    async function createUser(name, email, password, role) {
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName: name, username: email, password, role })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return { success: false, message: data.error || 'Signup failed' };
      return { success: true, message: `Account created for ${name}. Please log in.` };
    }

    // Login via our API
    async function loginUser(email, password) {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: email, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return { success: false, error: data.error || 'Login failed' };
      
      // Store JWT token - using both 'auth_token' and 'token' for compatibility
      localStorage.setItem('auth_token', data.token);
      localStorage.setItem('token', data.token);
      localStorage.setItem('role', data.role);
      if (data.fullName) localStorage.setItem('fullName', data.fullName);
      if (data.username) localStorage.setItem('username', data.username);
      if (data.id) {
        localStorage.setItem('userId', String(data.id));
        localStorage.setItem('patient_id', String(data.id));
      }
      return { success: true, role: data.role };
    }

    // Handle login form submission
    document.getElementById('loginFormElement').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const role = document.getElementById('loginRole').value;
      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      try {
        const result = await loginUser(email, password);
        console.log('[index.html] Login result:', result);
        if (result.success) {
          showMessage('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            const roleFromApi = result.role;
            if (roleFromApi === 'doctor') {
              window.location.href = 'doctor.html';
            } else if (roleFromApi === 'patient') {
              window.location.href = 'patient1.html';
            }
          }, 1500); // 1.5 second delay to ensure auth state is set
        } else {
          showMessage('Login failed: ' + result.error);
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        }
      } catch (error) {
        showMessage('Login failed: ' + error.message);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });

    // Handle signup form submission
    document.getElementById('signupFormElement').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const role = document.getElementById('signupRole').value;
      
      const signupBtn = document.getElementById('signupBtn');
      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating Account...';
      
      const result = await createUser(name, email, password, role);
      
      if (result.success) {
        showMessage(result.message, 'success');
        document.getElementById('signupFormElement').reset();
        // Switch to login tab after successful signup
        setTimeout(() => {
          document.getElementById('loginTab').click();
        }, 2000);
      } else {
        showMessage(result.message);
      }
      
      signupBtn.disabled = false;
      signupBtn.textContent = 'Create Account';
    });

    // Make createTestUser function global
    window.createTestUser = async function(name, email, password, role) {
      const result = await createUser(name, email, password, role);
      showMessage(result.message, result.success ? 'success' : 'error');
    };
  </script>
</body>

</html>
