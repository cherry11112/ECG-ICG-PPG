<script>
document.addEventListener('DOMContentLoaded', () => {
  const name = localStorage.getItem('fullName') || localStorage.getItem('username') || '[Username]';
  const el = document.getElementById('userName');
  if (el) el.textContent = name;
});

// Check if user already submitted feedback today
async function checkDailyFeedbackStatus() {
  const token = localStorage.getItem('token');
  if (!token) return false;
  
  try {
    const resp = await fetch('/api/feedback', {
      method: 'GET',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    
    if (!resp.ok) return false;
    
    const data = await resp.json();
    const items = data.items || [];
    
    if (items.length === 0) return false;
    
    // Check if most recent feedback was submitted today
    const latestFeedback = items[0];
    const feedbackDate = new Date(latestFeedback.created_at).toDateString();
    const today = new Date().toDateString();
    
    return feedbackDate === today;
  } catch (err) {
    console.error('Error checking feedback status:', err);
    return false;
  }
}

// Disable feedback if already submitted
document.addEventListener('DOMContentLoaded', async () => {
  const alreadySubmitted = await checkDailyFeedbackStatus();
  
  if (alreadySubmitted) {
    const feedbackForm = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    
    if (feedbackForm) {
      // Disable all form inputs
      feedbackForm.querySelectorAll('input, select, textarea').forEach(el => {
        el.disabled = true;
      });
      
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Already submitted today';
        submitBtn.style.cursor = 'not-allowed';
        submitBtn.style.opacity = '0.5';
      }
    }
    
    // Add a notification message
    const cardDiv = feedbackForm?.closest('.bg-white');
    if (cardDiv) {
      const notification = document.createElement('div');
      notification.className = 'bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded mb-4';
      notification.textContent = 'Daily feedback already submitted today. You can submit again tomorrow.';
      cardDiv.insertBefore(notification, cardDiv.firstChild);
    }
  }
});
</script>

  // or patient-status data, alongside the spoken response (not instead of it).
  function renderToolResult(functionName, result) {
    if (!result) return
    if (functionName === 'get_biosignal_result' && result.ready) {
      const m = result.measurements || {}
      const rows = []
      if (result.rhythm) rows.push(`<dt>Rhythm</dt><dd>${escapeHtml(result.rhythm)}</dd>`)
      if (m.heart_rate_mean_bpm != null) rows.push(`<dt>Heart rate</dt><dd>${escapeHtml(m.heart_rate_mean_bpm)} bpm</dd>`)
      if (Array.isArray(result.abnormalities) && result.abnormalities.length) {
        rows.push(`<dt>Abnormalities</dt><dd>${result.abnormalities.map(escapeHtml).join(', ')}</dd>`)
      }
      resultsEl.innerHTML = `
        <h4>${escapeHtml((result.signal_type || 'Signal').toUpperCase())} result</h4>
        ${rows.length ? `<dl>${rows.join('')}</dl>` : ''}
        ${result.summary ? `<div class="muted" style="margin-top:6px;">${escapeHtml(result.summary)}</div>` : ''}
      `
      resultsEl.style.display = 'block'
    } else if (functionName === 'get_patient_context' && result.latest_diagnostic) {
      const d = result.latest_diagnostic
      const rows = []
      if (d.risk_level) rows.push(`<dt>Risk level</dt><dd>${escapeHtml(d.risk_level)}</dd>`)
      if (d.risk_percentage != null) rows.push(`<dt>Risk</dt><dd>${escapeHtml(d.risk_percentage)}%</dd>`)
      resultsEl.innerHTML = `
        <h4>Latest status</h4>
        ${rows.length ? `<dl>${rows.join('')}</dl>` : ''}
        ${d.summary ? `<div class="muted" style="margin-top:6px;">${escapeHtml(d.summary)}</div>` : ''}
      `
      resultsEl.style.display = 'block'
    }
  }

  const BACKEND_URL = window.VOICE_AGENT_BACKEND_URL || ''

  let USER_ID
  async function fetchCurrentUser() {
    const token = localStorage.getItem('token')
    if (!token) throw new Error('No token found')
    const resp = await fetch('/api/user', { headers: { 'Authorization': `Bearer ${token}` } })
    const data = await resp.json()
    USER_ID = Array.isArray(data) ? data[0]?.id : data?.id
    if (!USER_ID) throw new Error('User ID not found')
  }

  await fetchCurrentUser()
  localStorage.setItem('userId', USER_ID)
  localStorage.setItem('patientId', USER_ID)
  const sessionId = `user_${USER_ID}`

  let selectedMode = null  // 'daily_feedback' | 'general_chat'
  let voiceSession = null

  // --- Mode selection handlers ---
  function selectMode(mode) {
    if (voiceSession) return
    if (!BACKEND_URL) {
      setStatus('Voice agent is not configured yet — ask an admin to set VOICE_AGENT_BACKEND_URL.', 'error')
      return
    }
    selectedMode = mode
    modeSelect.style.display = 'none'
    log.style.display = 'block'
    stopRow.style.display = 'block'
    startSession(mode)
  }

  document.getElementById('mode-feedback').addEventListener('click', () => selectMode('daily_feedback'))
  document.getElementById('mode-chat').addEventListener('click', () => selectMode('general_chat'))
  stopBtn.addEventListener('click', stop)

  async function startSession(mode) {
    resultsEl.style.display = 'none'
    resultsEl.innerHTML = ''
    append('system', 'Connecting to voice assistant…', 'muted')

    voiceSession = createVoiceSession({
      backendUrl: BACKEND_URL,
      token: localStorage.getItem('token'),
      patientId: USER_ID,
      mode,
      sessionId: `${sessionId}_${mode}_${Date.now()}`,
      audioEl,
      onStatus: (text, kind) => { setStatus(text, kind); append('system', text, kind) },
      onTranscript: (role, text) => append(role, text, role === 'assistant' ? 'success' : ''),
      onToolResult: renderToolResult,
    })

    try {
      await voiceSession.connect()
    } catch (e) {
      console.error('Voice session connect failed:', e)
      setStatus('Could not connect: ' + (e.message || 'unknown error'), 'error')
      append('system', 'Could not connect: ' + (e.message || 'unknown error'), 'error')
    }
  }

  async function stop() {
    if (voiceSession) {
      try { await voiceSession.disconnect() } catch (e) { console.error('Disconnect error:', e) }
      voiceSession = null
    }
    selectedMode = null
    setStatus('')
    resultsEl.style.display = 'none'
    resultsEl.innerHTML = ''
    // Reset UI back to mode selector
    log.style.display = 'none'
    log.innerHTML = ''
    stopRow.style.display = 'none'
    modeSelect.style.display = 'block'
  }

  console.log('Voice Chat widget loaded (Pipecat)')
})()
</script>


</body>
</html>
