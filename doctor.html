<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@1/dist/index.mjs';
    injectSpeedInsights();
  </script>
</head>

<body class="bg-gray-50">

<div class="fixed top-0 left-0 w-full bg-white shadow-md z-50 flex items-center px-24 py-2">
    <img src="img/IZM.png" alt="" class="h-24">
  </div>

  <div class="flex justify-center items-center h-screen px-4 sm:px-6 md:px-12 lg:px-24 xl:px-30">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full sm:w-[300px] md:w-[400px] lg:w-[400px] max-w-[90%]">
      <h2 class="text-center text-2xl font-semibold mb-6">Patients List</h2>  
      <form id="patientForm">   
      <label for="patientSelect" class="block text-sm font-medium mb-2">Patient:</label>
      <select id="patientSelect" name="patientSelect" required 
              class="w-full px-4 py-2 mb-6 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-300 focus:outline-none">
        <option value="" disabled selected>Loading patients...</option>
        <option value="" >John Doe</option>
        <option value="" >Anne Smith</option>

      </select>

      <button type="submit" 
              class="w-full bg-white text-black border-2 border-gray-600 hover:bg-gray-300 hover:border-gray-800 rounded-lg transition duration-200 mb-4 py-2">
        View Patient
      </button>
    </form>
    
    <button type="button" id="logoutBtn"
            class="w-full bg-white text-black border-2 border-gray-600 hover:bg-gray-300 hover:border-gray-800 rounded-lg transition duration-200 mb-4 py-2">
      Logout
    </button>
    
    <div id="errorMessage" class="text-red-500 text-center hidden"></div>
    </div>
  </div>

</body>
<script>
  async function fetchPatients() {
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    if (!token || role !== 'doctor') { window.location.href = 'index.html'; return; }
    
    try {
      const res = await fetch('/api/doctor', { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) { 
        if (res.status === 401) window.location.href = 'index.html'; 
        return; 
      }
      const data = await res.json();
      const patients = data.patients || [];
      const sel = document.getElementById('patientSelect');
      sel.innerHTML = '<option value="" disabled selected>Select Patient</option>';
      
      if (patients.length === 0) {
        sel.innerHTML = '<option value="" disabled>No patients found</option>';
        return;
      }
      
      patients.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.full_name || p.username;
        sel.appendChild(opt);
      });
    } catch (error) {
      console.error('Error fetching patients:', error);
      document.getElementById('errorMessage').textContent = 'Failed to load patients';
      document.getElementById('errorMessage').classList.remove('hidden');
    }
  }

  fetchPatients();

  document.getElementById('patientForm').addEventListener('submit', function(e){
    e.preventDefault();
    const patientId = document.getElementById('patientSelect').value;
    if (patientId) {
      localStorage.setItem('selectedPatientId', patientId);
      window.location.href = `P1report.html?patientId=${encodeURIComponent(patientId)}`;
    } else {
      alert('Please select a patient');
    }
  });

  // Logout button handler
  document.getElementById('logoutBtn').addEventListener('click', function(e) {
    e.preventDefault();
    // Clear all stored authentication data
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    localStorage.removeItem('fullName');
    localStorage.removeItem('username');
    localStorage.removeItem('userId');
    localStorage.removeItem('selectedPatientId');
    
    // Redirect to login page
    window.location.href = 'index.html';
  });
</script>

</html>
