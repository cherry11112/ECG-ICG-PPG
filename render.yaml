# Render Blueprint — deploys backend/ as a persistent Python web service.
#
# This file exists specifically so the deploy config is explicit and versioned,
# not something to click through in a dashboard and get wrong (that's what
# happened on Railway: Root Directory silently stayed at the repo root instead
# of backend/, so it ran the wrong app entirely — `npm start` from the root
# package.json — for days before anyone noticed).
#
# To use: Render dashboard -> New -> Blueprint -> point at this GitHub repo.
# Render reads this file automatically and creates the service with the
# settings below already correct. Secrets (sync: false) must still be filled
# in manually in the Render dashboard after the Blueprint is created — this
# file intentionally never contains real secret values.
services:
  - type: web
    name: ecg-voice-agent-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: DAILY_API_KEY
        sync: false
      - key: DAILY_API_URL
        value: https://api.daily.co/v1
      - key: STT_PROVIDER
        value: deepgram
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: TTS_PROVIDER
        value: cartesia
      - key: CARTESIA_API_KEY
        sync: false
      - key: CARTESIA_VOICE_ID
        value: 79a125e8-cd45-4c13-8a67-188112f4dd22
      - key: DEEPGRAM_TTS_VOICE
        value: aura-2-thalia-en
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: APP_API_BASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
